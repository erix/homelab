apiVersion: apps/v1
kind: Deployment
metadata:
  name: operator
  namespace: tailscale
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: operator
  template:
    metadata:
      labels:
        app: operator
    spec:
      serviceAccountName: operator
      containers:
        - name: operator
          image: tailscale/k8s-operator:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: OPERATOR_HOSTNAME
              value: "tailscale-operator"
            - name: OPERATOR_SECRET
              value: "operator"
            - name: OPERATOR_LOGGING
              value: "debug"
            - name: OPERATOR_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: CLIENT_ID_FILE
              value: "/oauth/client_id"
            - name: CLIENT_SECRET_FILE
              value: "/oauth/client_secret"
            - name: PROXY_IMAGE
              value: "tailscale/tailscale:latest"
            - name: PROXY_TAGS
              value: "tag:k8s"
            - name: AUTH_PROXY
              value: "false"
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: oauth
              mountPath: /oauth
              readOnly: true
      volumes:
        - name: oauth
          secret:
            secretName: operator-oauth
