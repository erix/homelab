apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: hello-confidence-tunnel
  namespace: flux-system
spec:
  interval: 10m
  path: ../../apps/hello-confidence-tunnel
  prune: true
  wait: true
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: flux-system
  dependsOn:
    - name: hello-confidence-website
