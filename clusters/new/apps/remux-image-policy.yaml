apiVersion: image.toolkit.fluxcd.io/v1
kind: ImageRepository
metadata:
  name: remux
  namespace: flux-system
spec:
  image: ghcr.io/erix/remux
  interval: 5m
---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImagePolicy
metadata:
  name: remux
  namespace: flux-system
spec:
  imageRepositoryRef:
    name: remux
  # Tags from erix/remux's deploy branch: <upstream release>-erix.<CI run>.
  filterTags:
    pattern: "^[0-9]+\\.[0-9]+\\.[0-9]+-erix\\.(?P<run>[0-9]+)$"
    extract: "$run"
  policy:
    numerical:
      order: asc
---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImageUpdateAutomation
metadata:
  name: remux
  namespace: flux-system
spec:
  interval: 5m
  sourceRef:
    kind: GitRepository
    name: flux-system
  git:
    checkout:
      ref:
        branch: main
    commit:
      author:
        email: fluxcdbot@users.noreply.github.com
        name: fluxcdbot
      messageTemplate: "chore: update remux image"
    push:
      branch: main
  update:
    path: ./apps/remux
    strategy: Setters
