apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: movie-night
  namespace: flux-system
spec:
  interval: 5m
  ref:
    branch: master
  secretRef:
    name: flux-system-http-auth
  url: https://github.com/erix/movie-night-app
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: movie-night
  namespace: flux-system
spec:
  interval: 10m
  path: ./k8s
  prune: true
  sourceRef:
    kind: GitRepository
    name: movie-night
