apiVersion: image.toolkit.fluxcd.io/v1
kind: ImageRepository
metadata:
  name: aiostreams
  namespace: flux-system
spec:
  image: ghcr.io/viren070/aiostreams
  interval: 1h
---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImagePolicy
metadata:
  name: aiostreams
  namespace: flux-system
spec:
  imageRepositoryRef:
    name: aiostreams
  filterTags:
    pattern: "^v(?P<version>2\\.31\\.[0-9]+)$"
    extract: "$version"
  policy:
    semver:
      range: ">=2.31.0 <2.32.0"
---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImageUpdateAutomation
metadata:
  name: aiostreams
  namespace: flux-system
spec:
  suspend: true
  interval: 1h
  sourceRef:
    kind: GitRepository
    name: flux-system
  git:
    checkout:
      ref:
        branch: main
    commit:
      author:
        email: fluxcdbot@users.noreply.github.com
        name: fluxcdbot
      messageTemplate: "chore: update aiostreams image"
    push:
      branch: main
  update:
    path: ./apps/aiostreams
    strategy: Setters
