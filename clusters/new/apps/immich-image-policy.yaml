apiVersion: image.toolkit.fluxcd.io/v1
kind: ImageRepository
metadata:
  name: immich
  namespace: flux-system
spec:
  image: ghcr.io/immich-app/immich-server
  interval: 1h
---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImagePolicy
metadata:
  name: immich
  namespace: flux-system
spec:
  imageRepositoryRef:
    name: immich
  filterTags:
    pattern: "^v(?P<version>[0-9]+\\.[0-9]+\\.[0-9]+)$"
    extract: "$version"
  policy:
    semver:
      # Stay on Immich v3; major upgrades require migration review.
      range: ">=3.0.0 <4.0.0"
---
---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImageRepository
metadata:
  name: immich-ml
  namespace: flux-system
spec:
  image: ghcr.io/immich-app/immich-machine-learning
  interval: 1h
---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImagePolicy
metadata:
  name: immich-ml
  namespace: flux-system
spec:
  imageRepositoryRef:
    name: immich-ml
  filterTags:
    pattern: "^v(?P<version>[0-9]+\\.[0-9]+\\.[0-9]+)$"
    extract: "$version"
  policy:
    semver:
      # Stay on Immich v3; major upgrades require migration review.
      range: ">=3.0.0 <4.0.0"
---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImageUpdateAutomation
metadata:
  name: immich
  namespace: flux-system
spec:
  interval: 1h
  sourceRef:
    kind: GitRepository
    name: flux-system
  git:
    checkout:
      ref:
        branch: main
    commit:
      author:
        email: fluxcdbot@users.noreply.github.com
        name: fluxcdbot
      messageTemplate: "chore: update immich image"
    push:
      branch: main
  update:
    path: ./apps/immich
    strategy: Setters
