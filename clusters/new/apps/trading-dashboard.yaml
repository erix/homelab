# GitRepository for trading-dashboard source code is not needed
# We pull pre-built images from GHCR via ImageRepository (see below)
# The Kustomization references flux-system (homelab) GitRepository instead

apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: trading-dashboard
  namespace: flux-system
spec:
  interval: 10m
  path: ../../apps/trading-dashboard
  prune: true
  targetNamespace: default
  sourceRef:
    kind: GitRepository
    name: flux-system
  images:
    - name: ghcr.io/erix/trading-dashboard
      # Automatically follow the newest successful master build selected by Flux.
      newTag: master-103-sha-457f0f8 # {"$imagepolicy":"flux-system:trading-dashboard:tag"}
---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImageRepository
metadata:
  name: trading-dashboard
  namespace: flux-system
spec:
  image: ghcr.io/erix/trading-dashboard
  interval: 1m
  secretRef:
    name: ghcr-credentials
---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImagePolicy
metadata:
  name: trading-dashboard
  namespace: flux-system
spec:
  imageRepositoryRef:
    name: trading-dashboard
  filterTags:
    pattern: "^master-(?P<run>[0-9]+)-sha-[a-f0-9]{7}$"
    extract: "$run"
  policy:
    numerical:
      order: asc
---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImageUpdateAutomation
metadata:
  name: trading-dashboard
  namespace: flux-system
spec:
  suspend: false
  interval: 1m
  sourceRef:
    kind: GitRepository
    name: flux-system
  git:
    checkout:
      ref:
        branch: main
    commit:
      author:
        email: fluxcdbot@users.noreply.github.com
        name: fluxcdbot
      messageTemplate: "chore: update trading-dashboard image"
    push:
      branch: main
  update:
    path: ./clusters/new/apps
    strategy: Setters
