# LAN-only (no Ingress): the settings page refuses any Host header that is not an IP address, and
# rex reads videos from relay_url, so both use this MetalLB address. Settings: http://192.168.11.216:9982/
apiVersion: v1
kind: Service
metadata:
  name: rex-stremio
  labels:
    app: rex-stremio
  annotations:
    metallb.universe.tf/loadBalancerIPs: 192.168.11.216
spec:
  type: LoadBalancer
  selector:
    app: rex-stremio
  ports:
    - name: http
      port: 9982
      targetPort: http
      protocol: TCP
