# LAN/Tailscale-only admin UI (no Cloudflare tunnel hostname).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: threadfin
  namespace: threadfin
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - threadfin.erix-homelab.site
      secretName: erix-homelab-site-tls
  rules:
    - host: threadfin.erix-homelab.site
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: threadfin
                port:
                  number: 34400
