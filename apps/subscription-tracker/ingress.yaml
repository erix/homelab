apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: subscription-tracker
  namespace: default
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
spec:
  rules:
    - host: subs.erix-homelab.site
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: subscription-tracker
                port:
                  number: 80
