apiVersion: apps/v1
kind: Deployment
metadata:
  name: aiostreams
  namespace: stremio
  labels:
    app: aiostreams
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: aiostreams
  template:
    metadata:
      labels:
        app: aiostreams
    spec:
      containers:
      - name: aiostreams
        image: ghcr.io/viren070/aiostreams:v2.31.1@sha256:26d93653c3a5d0835db9189d6aca21d05614e68107c4d4a3ec7196b60c88c3bc
        ports:
        - containerPort: 3000
          name: http
        envFrom:
        - secretRef:
            name: aiostreams-secret
        env:
        # Reuse the already validated metadata credentials without copying or
        # exposing their values. TMDB is intentionally omitted because the
        # existing key currently fails upstream validation.
        - name: TVDB_API_KEY
          valueFrom:
            secretKeyRef:
              name: aiometadata-secret
              key: TVDB_API_KEY
        - name: TRAKT_CLIENT_ID
          valueFrom:
            secretKeyRef:
              name: aiometadata-secret
              key: TRAKT_CLIENT_ID
        volumeMounts:
        - name: data
          mountPath: /app/data
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "1000m"
        livenessProbe:
          httpGet:
            path: /
            port: 3000
          initialDelaySeconds: 30
          periodSeconds: 15
          timeoutSeconds: 5
          failureThreshold: 5
        readinessProbe:
          httpGet:
            path: /
            port: 3000
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: aiostreams-data
      topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: ScheduleAnyway
        labelSelector:
          matchLabels:
            app: aiostreams
