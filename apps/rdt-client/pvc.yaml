---
# rdt db — local SSD
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: rdt-db-pvc
  namespace: rdt-client
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path-ssd
  resources:
    requests:
      storage: 10Gi
