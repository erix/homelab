apiVersion: apps/v1
kind: Deployment
metadata:
  name: rdt-client
  namespace: rdt-client
  labels:
    app: rdt-client
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rdt-client
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: rdt-client
    spec:
      containers:
      - name: rdt-client
        image: erix12/rdt-client-manual-download:latest
        imagePullPolicy: Always
        env:
        - name: LOG_LEVEL
          value: "Warning"
        ports:
        - containerPort: 6500
        livenessProbe:
          httpGet:
            path: /
            port: 6500
          initialDelaySeconds: 30
          periodSeconds: 30
          timeoutSeconds: 10
          failureThreshold: 3
        volumeMounts:
        - mountPath: /data/downloads
          name: rdt-downloads
        - mountPath: /data/db
          name: rdt-db
      volumes:
      - name: rdt-downloads
        persistentVolumeClaim:
          claimName: rdt-downloads-pvc
      - name: rdt-db
        persistentVolumeClaim:
          claimName: rdt-db-pvc
