apiVersion: apps/v1
kind: Deployment
metadata:
  name: rdt-client
  namespace: rdt-client
  labels:
    app: rdt-client
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rdt-client
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: rdt-client
    spec:
      initContainers:
      - name: filebot-license-init
        image: jlesage/filebot:latest
        command: ['sh', '-c', '/opt/filebot/filebot --license /license/license.psm']
        volumeMounts:
        - mountPath: /license
          name: filebot-license
        - mountPath: /config
          name: filebot-config
      containers:
      - name: rdt-client
        image: erix12/rdt-client-manual-download:latest
        imagePullPolicy: Always
        env:
        - name: LOG_LEVEL
          value: "Warning"
        ports:
        - containerPort: 6500
        livenessProbe:
          httpGet:
            path: /
            port: 6500
          initialDelaySeconds: 30
          periodSeconds: 30
          timeoutSeconds: 10
          failureThreshold: 3
        volumeMounts:
        - mountPath: /data/downloads
          name: rdt-downloads
        - mountPath: /data/db
          name: rdt-db

      - name: filebot
        image: jlesage/filebot:latest
        env:
        - name: FILEBOT_GUI
          value: "0"
        - name: USER_ID
          value: "911"
        - name: GROUP_ID
          value: "911"
        - name: AMC_INTERVAL
          value: "3600"  # 1h fallback only - primary trigger via filebot-trigger sidecar
        - name: AMC_ACTION
          value: "symlink"
        - name: AMC_INPUT_DIR
          value: "/downloads"
        - name: AMC_OUTPUT_DIR
          value: "/media"
        - name: AMC_MOVIE_FORMAT
          value: "{ plex.id % \" [\" % {edition} % \", \" % {vf} % \", \" % {hdr} %\"]\" }"
        - name: AMC_SERIES_FORMAT
          value: "{ plex.id % \" [\" % {edition} % \", \" % {vf} % \", \" % {hdr} %\"]\" }"
        - name: PLEX_TOKEN
          valueFrom:
            secretKeyRef:
              name: rdt-filebot-integrations
              key: PLEX_TOKEN
        - name: AMC_CUSTOM_OPTIONS
          value: >-
            --def excludeList=/media/.excludes
            --def plex=plex.erix-homelab.site:$(PLEX_TOKEN)
            --def discord=https://discord.com/api/webhooks/1238780467562545153/qIfbeRMkuBynXeZlvKVdDBmGw413ELZ2DjlNNbhKzSTMFNbShtUEX5CfLylt-PwIMu2f
        volumeMounts:
        - mountPath: /downloads
          name: rdt-downloads
        - mountPath: /media
          name: rdt-media
        - mountPath: /config
          name: filebot-config

      - name: filebot-trigger
        image: jlesage/filebot:latest
        command: ['sh', '/scripts/trigger.sh']
        env:
        - name: USER_ID
          value: "911"
        - name: GROUP_ID
          value: "911"
        - name: PLEX_TOKEN
          valueFrom:
            secretKeyRef:
              name: rdt-filebot-integrations
              key: PLEX_TOKEN
        volumeMounts:
        - mountPath: /downloads
          name: rdt-downloads
        - mountPath: /media
          name: rdt-media
        - mountPath: /config
          name: filebot-config
        - mountPath: /scripts
          name: filebot-trigger-script

      volumes:
      - name: rdt-downloads
        persistentVolumeClaim:
          claimName: rdt-downloads-pvc
      - name: rdt-db
        persistentVolumeClaim:
          claimName: rdt-db-pvc
      - name: rdt-media
        persistentVolumeClaim:
          claimName: rdt-media-pvc
      - name: filebot-license
        secret:
          secretName: filebot-license
      - name: filebot-config
        emptyDir: {}
      - name: filebot-trigger-script
        configMap:
          name: filebot-trigger-script
          defaultMode: 0755
