apiVersion: apps/v1
kind: Deployment
metadata:
  name: hello-confidence-signup
  namespace: default
  labels:
    app: hello-confidence-signup
spec:
  replicas: 1
  selector:
    matchLabels:
      app: hello-confidence-signup
  template:
    metadata:
      labels:
        app: hello-confidence-signup
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: signup
          image: python:3.13-alpine@sha256:c25cd44f45df1279a2cba589e67dfcd9db04647ea483b117a7de8b1a99bdfb23
          imagePullPolicy: IfNotPresent
          command:
            - python
            - /app/signup-server.py
          env:
            - name: PYTHONDONTWRITEBYTECODE
              value: "1"
            - name: MAILERLITE_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: hello-confidence-mailerlite
                  key: api-token
            - name: MAILERLITE_GROUP_ID
              value: "193082555145126922"
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            requests:
              cpu: 10m
              memory: 24Mi
            limits:
              cpu: 200m
              memory: 96Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: app
              mountPath: /app
              readOnly: true
      volumes:
        - name: app
          configMap:
            name: hello-confidence-signup
