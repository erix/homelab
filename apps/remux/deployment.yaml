apiVersion: apps/v1
kind: Deployment
metadata:
  name: remux
  namespace: remux
  labels:
    app: remux
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: remux
  template:
    metadata:
      labels:
        app: remux
    spec:
      containers:
        - name: remux
          # Built from erix/remux's deploy branch (upstream + own commits);
          # Flux's remux image policy bumps the tag on each new build.
          image: ghcr.io/erix/remux:0.36.1-erix.2 # {"$imagepolicy":"flux-system:remux"}
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
          volumeMounts:
            - name: data
              mountPath: /data
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 5
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 2Gi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: remux-data
