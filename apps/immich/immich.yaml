apiVersion: apps/v1
kind: Deployment
metadata:
  name: immich-server
  namespace: immich
spec:
  replicas: 1
  selector:
    matchLabels:
      app: immich-server
  template:
    metadata:
      labels:
        app: immich-server
    spec:
      containers:
      - name: immich-server
        image: ghcr.io/immich-app/immich-server:v2.7.3 # {"$imagepolicy":"flux-system:immich"}
        env:
        - name: DB_HOSTNAME
          value: immich-postgres
        - name: DB_PORT
          value: "5432"
        - name: DB_USERNAME
          valueFrom:
            secretKeyRef:
              name: immich-secret
              key: DB_USERNAME
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: immich-secret
              key: DB_PASSWORD
        - name: DB_DATABASE_NAME
          valueFrom:
            secretKeyRef:
              name: immich-secret
              key: DB_DATABASE_NAME
        - name: REDIS_HOSTNAME
          value: immich-redis
        - name: UPLOAD_LOCATION
          value: /usr/src/app/upload
        volumeMounts:
        - mountPath: /usr/src/app/upload
          name: immich-library
        - mountPath: /usr/src/app/upload/thumbs
          name: immich-data
          subPath: thumbs
        - mountPath: /usr/src/app/upload/encoded-video
          name: immich-data
          subPath: encoded-video
        - mountPath: /usr/src/app/upload/profile
          name: immich-data
          subPath: profile
      volumes:
      - name: immich-library
        persistentVolumeClaim:
          claimName: immich-library-pvc
      - name: immich-data
        persistentVolumeClaim:
          claimName: immich-data-pvc
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: immich-machine-learning
  namespace: immich
spec:
  replicas: 1
  selector:
    matchLabels:
      app: immich-machine-learning
  template:
    metadata:
      labels:
        app: immich-machine-learning
    spec:
      containers:
      - name: immich-machine-learning
        image: ghcr.io/immich-app/immich-machine-learning:v2.7.4 # {"$imagepolicy":"flux-system:immich-ml"}
        env:
        - name: REDIS_HOSTNAME
          value: immich-redis
        volumeMounts:
        - mountPath: /cache
          name: immich-data
          subPath: ml-cache
      volumes:
      - name: immich-data
        persistentVolumeClaim:
          claimName: immich-data-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: immich-server
  namespace: immich
spec:
  selector:
    app: immich-server
  ports:
  - port: 2283
    targetPort: 2283
