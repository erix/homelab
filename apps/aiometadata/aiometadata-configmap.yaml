apiVersion: v1
kind: ConfigMap
metadata:
  name: aiometadata-config
  namespace: stremio
data:
  PORT: "3232"
  HOST_NAME: "aiometadata.erix-homelab.site"
  NODE_ENV: "production"
  LOG_LEVEL: "info"
  DATABASE_URI: "sqlite://addon/data/db.sqlite"
  REDIS_URL: "redis://aiometadata-redis:6379"
  TZ: "Europe/Berlin"
  DISABLE_METRICS: "false"

  # Cache TTL Configuration
  CATALOG_TTL: "86400"
  META_TTL: "604800"

  # Cache Warming
  ENABLE_CACHE_WARMING: "true"
  CACHE_WARMUP_MODE: "essential"
  CATALOG_WARMUP_INTERVAL_HOURS: "24"
  CATALOG_WARMUP_INITIAL_DELAY_SECONDS: "300"
  CATALOG_WARMUP_MAX_PAGES_PER_CATALOG: "100"

  # Catalog Configuration
  CATALOG_LIST_ITEMS_SIZE: "20"
