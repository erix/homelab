apiVersion: apps/v1
kind: Deployment
metadata:
  name: aiometadata-redis
  namespace: stremio
  labels:
    app: aiometadata-redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: aiometadata-redis
  template:
    metadata:
      labels:
        app: aiometadata-redis
    spec:
      containers:
      - name: redis
        image: redis:7-alpine
        ports:
        - containerPort: 6379
          name: redis
        args:
          - redis-server
          - --appendonly
          - "yes"
          - --save
          - "900 1"
          - --save
          - "300 10"
          - --save
          - "60 10000"
        volumeMounts:
        - name: data
          mountPath: /data
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          exec:
            command:
            - redis-cli
            - ping
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          exec:
            command:
            - redis-cli
            - ping
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: aiometadata-redis-data
      topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: ScheduleAnyway
        labelSelector:
          matchLabels:
            app: aiometadata-redis
