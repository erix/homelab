apiVersion: v1
kind: ConfigMap
metadata:
  name: ibeam-inputs
  namespace: default
  labels:
    app: ibeam
data:
  # Full Gateway conf.yaml. IBeam overwrites the bundled file, so this must
  # include listen/ssl settings as well as the pod IP allowlist.
  conf.yaml: |
    ip2loc: "US"
    proxyRemoteSsl: true
    proxyRemoteHost: "https://api.ibkr.com"
    listenPort: 5000
    listenSsl: true
    ccp: false
    svcEnvironment: "v1"
    sslCert: "vertx.jks"
    sslPwd: "mywebapi"
    authDelay: 3000
    portalBaseURL: ""
    serverOptions:
      blockedThreadCheckInterval: 1000000
      eventLoopPoolSize: 20
      workerPoolSize: 20
      maxWorkerExecuteTime: 100
      internalBlockingPoolSize: 20
    cors:
      origin.allowed: "*"
      allowCredentials: false
    webApps:
      - name: "demo"
        index: "index.html"
    ips:
      allow:
        - 127.0.0.1
        - 10.*
        - 172.*
        - 192.*
        - 100.*
      deny:
        - 0.0.0.0/0
