apiVersion: apps/v1
kind: Deployment
metadata:
  name: ibeam
  namespace: default
  labels:
    app: ibeam
spec:
  replicas: 1
  strategy:
    type: Recreate  # Only one instance per IBKR account
  selector:
    matchLabels:
      app: ibeam
  template:
    metadata:
      labels:
        app: ibeam
    spec:
      containers:
        - name: ibeam
          image: voyz/ibeam:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 5000
              name: rest-api
              protocol: TCP
          env:
            - name: IBEAM_LOG_LEVEL
              value: "INFO"
            # Disable SSL verification for internal health checks
            - name: IBEAM_VERIFY_SSL
              value: "False"
            # Don't try to auto-authenticate; allow manual login via browser
            - name: IBEAM_START_ACTIVE
              value: "false"
          resources:
            requests:
              memory: "512Mi"
              cpu: "200m"
            limits:
              memory: "1Gi"
              cpu: "500m"

      restartPolicy: Always
