apiVersion: batch/v1
kind: CronJob
metadata:
  name: ibeam-keepalive
  namespace: default
  labels:
    app: ibeam-keepalive
spec:
  # Same weekday window as autologin (06-22 UTC). Light tickle only — never logs in.
  schedule: "*/5 6-22 * * 1-5"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      backoffLimit: 0
      ttlSecondsAfterFinished: 600
      template:
        metadata:
          labels:
            app: ibeam-keepalive
        spec:
          restartPolicy: Never
          containers:
            - name: keepalive
              image: curlimages/curl:8.5.0
              env:
                - name: TELEGRAM_BOT_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: movie-night-telegram
                      key: telegram-bot-token
                      optional: true
                - name: TELEGRAM_CHAT_ID
                  valueFrom:
                    secretKeyRef:
                      name: movie-night-telegram
                      key: telegram-group-id
                      optional: true
              command:
                - /bin/sh
                - -c
                - |
                  set -eu
                  BASE="https://ibeam.default.svc:5000"
                  STATUS=$(curl -sk --max-time 10 "$BASE/v1/api/iserver/auth/status" || true)
                  echo "auth_status=$STATUS"
                  case "$STATUS" in
                    *'"authenticated":true'*|*'"authenticated": true'*)
                      curl -sk --max-time 10 "$BASE/v1/api/tickle" >/tmp/tickle || true
                      echo "event=tickle_ok"
                      ;;
                    *'"authenticated":false'*|*'"authenticated": false'*)
                      echo "event=unauthenticated"
                      # Only alert on a definitive false — empty/failed curls are not soft-locks.
                      # Rate-limit to :00 and :30 UTC.
                      MIN=$(date -u +%M)
                      case "$MIN" in
                        00|30)
                          if [ -n "${TELEGRAM_BOT_TOKEN:-}" ] && [ -n "${TELEGRAM_CHAT_ID:-}" ]; then
                            TEXT="IBeam keepalive: session unauthenticated. Autologin will try tickle/reauth before OTP."
                            curl -sS --max-time 15 \
                              -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
                              --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
                              --data-urlencode "text=${TEXT}" \
                              >/tmp/tg || echo "event=telegram_failed"
                            echo "event=telegram_auth_false_alert"
                          else
                            echo "event=telegram_skipped_missing_env"
                          fi
                          ;;
                        *)
                          echo "event=telegram_rate_limited"
                          ;;
                      esac
                      ;;
                    *)
                      # Empty body / curl failure / unexpected payload — do not Telegram.
                      echo "event=status_unreachable"
                      ;;
                  esac
              resources:
                requests:
                  memory: "16Mi"
                  cpu: "10m"
                limits:
                  memory: "32Mi"
                  cpu: "50m"
