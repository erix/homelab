# Archives the Zigbee2MQTT data directory to TrueNAS, keeping the newest 30.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: z2m-backup
  namespace: home-automation
  annotations:
    alerts.erix-homelab.site/max-age: 26h
spec:
  schedule: "15 1 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        spec:
          restartPolicy: Never
          containers:
            - name: z2m-backup
              image: alpine:3.19
              command:
                - /bin/sh
                - -c
                - |
                  set -euo pipefail
                  dest=/backups/z2m
                  mkdir -p "$dest"
                  file="$dest/z2m-$(date +%F).tar.gz"
                  tar -czf "$file.partial" -C /z2m-data .
                  gzip -t "$file.partial"
                  mv "$file.partial" "$file"
                  ls -t "$dest"/z2m-*.tar.gz | tail -n +31 | xargs -r rm -f
                  ls -lh "$file"
              volumeMounts:
                - name: z2m-data
                  mountPath: /z2m-data
                  readOnly: true
                - name: backups
                  mountPath: /backups
          volumes:
            - name: z2m-data
              persistentVolumeClaim:
                claimName: z2m-pvc
            - name: backups
              persistentVolumeClaim:
                claimName: k3s-backups-pvc
