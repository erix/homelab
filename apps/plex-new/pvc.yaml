# Plex config/metadata — local SSD
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: plex-config-pvc
  namespace: plex
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path-ssd
  resources:
    requests:
      storage: 50Gi
---
# Plex media — NFS on TrueNAS
apiVersion: v1
kind: PersistentVolume
metadata:
  name: plex-media-pv
spec:
  capacity:
    storage: 10Ti
  accessModes:
    - ReadOnlyMany
  nfs:
    server: 192.168.1.179
    path: /mnt/tank/media/plex
  persistentVolumeReclaimPolicy: Retain
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: plex-media-pvc
  namespace: plex
spec:
  accessModes:
    - ReadOnlyMany
  storageClassName: ""
  volumeName: plex-media-pv
  resources:
    requests:
      storage: 10Ti
---
# Plex downloads — NFS on TrueNAS (for symlink resolution)
apiVersion: v1
kind: PersistentVolume
metadata:
  name: plex-downloads-pv
spec:
  capacity:
    storage: 10Ti
  accessModes:
    - ReadOnlyMany
  nfs:
    server: 192.168.1.179
    path: /mnt/tank/downloads/rdt
  persistentVolumeReclaimPolicy: Retain
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: plex-downloads-pvc
  namespace: plex
spec:
  accessModes:
    - ReadOnlyMany
  storageClassName: ""
  volumeName: plex-downloads-pv
  resources:
    requests:
      storage: 10Ti
