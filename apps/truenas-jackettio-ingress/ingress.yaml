apiVersion: v1
kind: Service
metadata:
  name: truenas-jackettio-service
  namespace: default
spec:
  ports:
  - protocol: TCP
    port: 4000
    targetPort: 4000

---
apiVersion: v1
kind: Endpoints
metadata:
  name: truenas-jackettio-service
  namespace: default
subsets:
  - addresses:
      - ip: 192.168.1.179
    ports:
      - port: 4000

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: jackettio-ingress
  namespace: default
spec:
  ingressClassName: traefik
  rules:
  - host: jackettio.erix-homelab.site
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: truenas-jackettio-service
            port:
              number: 4000
  tls:
  - secretName: erix-homelab-site-tls
    hosts:
    - jackettio.erix-homelab.site
