# LAN/Tailscale only: resolves via the pihole *.erix-homelab.site wildcard to
# the Traefik VIP. Not published through the Cloudflare tunnel.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: shelfarr
  namespace: shelfarr
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - shelfarr.erix-homelab.site
      secretName: shelfarr-tls
  rules:
    - host: shelfarr.erix-homelab.site
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: shelfarr
                port:
                  number: 8080
