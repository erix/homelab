# Shelfarr (https://github.com/pedro-revez-silva/shelfarr): ebook and
# audiobook requests, delivered into Grimmory's library.
#
# The entrypoint starts as root, makes /rails/storage writable for PUID/PGID,
# generates the secret key base and encryption keys into /rails/storage on
# first start (so no Kubernetes Secret is needed), runs db:prepare, then
# drops to the rails user with gosu.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: shelfarr
  namespace: shelfarr
  labels:
    app: shelfarr
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: shelfarr
  template:
    metadata:
      labels:
        app: shelfarr
    spec:
      containers:
        - name: shelfarr
          image: ghcr.io/pedro-revez-silva/shelfarr:2026.11.09.1@sha256:295c122dcaa5a2bcf8a4e487c55957269bec947d63ad7352abc47a5430d81bde
          imagePullPolicy: IfNotPresent
          env:
            - name: PUID
              value: "1000"
            - name: PGID
              value: "1000"
            - name: TZ
              value: Europe/Berlin
            # Background jobs (searches, imports, library scans) run inside Puma.
            - name: SOLID_QUEUE_IN_PUMA
              value: "1"
            # Thruster listens here and proxies to Puma on 3000. Not 80: the
            # app drops root before binding.
            - name: HTTP_PORT
              value: "8080"
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          startupProbe:
            httpGet:
              path: /up
              port: http
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /up
              port: http
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /up
              port: http
            periodSeconds: 60
            timeoutSeconds: 10
            failureThreshold: 5
          resources:
            requests:
              cpu: 50m
              memory: 384Mi
            limits:
              memory: 1536Mi
          volumeMounts:
            - name: data
              mountPath: /rails/storage
            - name: grimmory-nfs
              subPath: library
              mountPath: /library
            # Default "Container path for downloads". Direct sources land here
            # before import; a torrent/usenet client would need a shared mount.
            - name: downloads
              mountPath: /downloads
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: shelfarr-data
        - name: grimmory-nfs
          persistentVolumeClaim:
            claimName: shelfarr-grimmory-nfs
        - name: downloads
          emptyDir:
            sizeLimit: 20Gi
