apiVersion: v1
kind: Service
metadata:
  name: kaiburg-dashboard-service
  namespace: default
spec:
  ports:
  - protocol: TCP
    port: 80
    targetPort: 3333

---
apiVersion: v1
kind: Endpoints
metadata:
  name: kaiburg-dashboard-service
  namespace: default
subsets:
  - addresses:
      - ip: 192.168.1.100
    ports:
      - port: 3333

---
apiVersion: traefik.containo.us/v1alpha1
kind: IngressRoute
metadata:
  name: kaiburg-dashboard-route
  namespace: default
spec:
  entryPoints:
    - web
    - websecure
  routes:
  - match: Host(`kaiburg.erix-homelab.site`)
    kind: Rule
    services:
    - name: kaiburg-dashboard-service
      port: 80
  tls:
    secretName: erix-homelab-site-tls
    domains:
    - main: erix-homelab.site

---
apiVersion: v1
kind: Service
metadata:
  name: kaiburg-gateway-service
  namespace: default
spec:
  ports:
  - protocol: TCP
    port: 80
    targetPort: 18789

---
apiVersion: v1
kind: Endpoints
metadata:
  name: kaiburg-gateway-service
  namespace: default
subsets:
  - addresses:
      - ip: 192.168.1.100
    ports:
      - port: 18789

---
apiVersion: traefik.containo.us/v1alpha1
kind: IngressRoute
metadata:
  name: kaiburg-gateway-route
  namespace: default
spec:
  entryPoints:
    - web
    - websecure
  routes:
  - match: Host(`openclaw.erix-homelab.site`)
    kind: Rule
    services:
    - name: kaiburg-gateway-service
      port: 80
  tls:
    secretName: erix-homelab-site-tls
    domains:
    - main: erix-homelab.site
