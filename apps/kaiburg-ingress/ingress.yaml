apiVersion: v1
kind: Service
metadata:
  name: kaiburg-dashboard-service
  namespace: default
spec:
  ports:
  - protocol: TCP
    port: 3333
    targetPort: 3333

---
apiVersion: v1
kind: Endpoints
metadata:
  name: kaiburg-dashboard-service
  namespace: default
subsets:
  - addresses:
      - ip: 192.168.1.100
    ports:
      - port: 3333

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: kaiburg-dashboard-ingress
  namespace: default
spec:
  ingressClassName: traefik
  rules:
  - host: kaiburg.erix-homelab.site
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: kaiburg-dashboard-service
            port:
              number: 3333
  tls:
  - secretName: erix-homelab-site-tls
    hosts:
    - kaiburg.erix-homelab.site

---
apiVersion: v1
kind: Service
metadata:
  name: kaiburg-gateway-service
  namespace: default
spec:
  ports:
  - protocol: TCP
    port: 18789
    targetPort: 18789

---
apiVersion: v1
kind: Endpoints
metadata:
  name: kaiburg-gateway-service
  namespace: default
subsets:
  - addresses:
      - ip: 192.168.1.100
    ports:
      - port: 18789

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: openclaw-ingress
  namespace: default
spec:
  ingressClassName: traefik
  rules:
  - host: openclaw.erix-homelab.site
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: kaiburg-gateway-service
            port:
              number: 18789
  tls:
  - secretName: erix-homelab-site-tls
    hosts:
    - openclaw.erix-homelab.site
