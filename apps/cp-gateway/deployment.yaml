apiVersion: apps/v1
kind: Deployment
metadata:
  name: cp-gateway
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cp-gateway
  template:
    metadata:
      labels:
        app: cp-gateway
    spec:
      containers:
      - name: cp-gateway
        image: ubuntu:22.04
        command:
          - /bin/bash
          - -c
          - |
            apt-get update && apt-get install -y default-jre curl
            cd /opt/cp-gateway
            exec ./bin/run.sh root/conf.yaml
        workingDir: /opt/cp-gateway
        ports:
        - containerPort: 5000
          name: http
        volumeMounts:
        - name: cp-gateway-volume
          mountPath: /opt/cp-gateway
        resources:
          requests:
            memory: "512Mi"
            cpu: "500m"
          limits:
            memory: "2Gi"
            cpu: "1000m"
        livenessProbe:
          httpGet:
            path: /
            port: 5000
            scheme: HTTPS
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
      restartPolicy: Always
      volumes:
      - name: cp-gateway-volume
        persistentVolumeClaim:
          claimName: cp-gateway-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: cp-gateway
  namespace: default
spec:
  selector:
    app: cp-gateway
  ports:
  - port: 5000
    targetPort: 5000
    name: http
  type: ClusterIP
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: cp-gateway-pvc
  namespace: default
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
