apiVersion: apps/v1
kind: Deployment
metadata:
  name: cp-gateway
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cp-gateway
  template:
    metadata:
      labels:
        app: cp-gateway
    spec:
      containers:
      - name: cp-gateway
        image: voyz/ibeam:latest
        ports:
        - containerPort: 5000
          name: http
        resources:
          requests:
            memory: "512Mi"
            cpu: "500m"
          limits:
            memory: "2Gi"
            cpu: "1000m"
        livenessProbe:
          httpGet:
            path: /
            port: 5000
            scheme: HTTPS
          initialDelaySeconds: 30
          periodSeconds: 10
          failureThreshold: 3
      restartPolicy: Always
---
apiVersion: v1
kind: Service
metadata:
  name: cp-gateway
  namespace: default
spec:
  selector:
    app: cp-gateway
  ports:
  - port: 5000
    targetPort: 5000
    name: http
  type: ClusterIP
