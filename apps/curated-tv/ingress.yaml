apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: curated-tv
  namespace: curated-tv
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - curated-tv.erix-homelab.site
      secretName: curated-tv-tls
  rules:
    - host: curated-tv.erix-homelab.site
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: curated-tv
                port:
                  number: 8080
