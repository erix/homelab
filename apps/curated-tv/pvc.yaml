# SQLite on local-path (RWO, node-local). Nightly sqlite3 .backup is in backup.yaml.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: curated-tv-data
  namespace: curated-tv
  labels:
    app: curated-tv
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 1Gi
