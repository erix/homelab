apiVersion: v1
kind: ConfigMap
metadata:
  name: trading-dashboard-config
  namespace: default
data:
  CP_GATEWAY_URL: "https://ibeam.default.svc:5000"
  CP_GATEWAY_PUBLIC_URL: "https://ibkr.erix-homelab.site"
  IBKR_ACCOUNT_ID: "U7525143"
  DB_PATH: "/data/db/positions.db"
  POSITIONS_META_FILE: "/trading/positions_meta.json"
