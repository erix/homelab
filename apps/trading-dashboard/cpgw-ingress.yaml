# ServersTransport to skip TLS verification for CP Gateway (self-signed cert)
apiVersion: traefik.io/v1alpha1
kind: ServersTransport
metadata:
  name: cpgw-skip-tls
  namespace: default
spec:
  insecureSkipVerify: true
---
# IngressRoute for the k3s IBeam Client Portal Gateway
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: cp-gateway-ingress
  namespace: default
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`ibkr.erix-homelab.site`)
      kind: Rule
      services:
        - name: ibeam
          port: 5000
          scheme: https
          serversTransport: cpgw-skip-tls
  tls:
    secretName: erix-homelab-site-tls
