# Service pointing to CP Gateway on the host (port 5000)
apiVersion: v1
kind: Service
metadata:
  name: cp-gateway
  namespace: default
spec:
  ports:
    - port: 5000
      targetPort: 5000
---
apiVersion: v1
kind: Endpoints
metadata:
  name: cp-gateway
  namespace: default
subsets:
  - addresses:
      - ip: 192.168.1.100
    ports:
      - port: 5000
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: cp-gateway-ingress
  namespace: default
  annotations:
    traefik.ingress.kubernetes.io/service.serversscheme: https
spec:
  ingressClassName: traefik
  rules:
    - host: ibkr.erix-homelab.site
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: cp-gateway
                port:
                  number: 5000
  tls:
    - hosts:
        - ibkr.erix-homelab.site
      secretName: erix-homelab-site-tls
