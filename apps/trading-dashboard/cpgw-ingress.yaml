# ServersTransport to skip TLS verification for CP Gateway (self-signed cert)
apiVersion: traefik.io/v1alpha1
kind: ServersTransport
metadata:
  name: cpgw-skip-tls
  namespace: default
spec:
  insecureSkipVerify: true
---
# Service pointing to CP Gateway on kaiburg (192.168.1.100 port 5000)
apiVersion: v1
kind: Service
metadata:
  name: cp-gateway
  namespace: default
spec:
  ports:
    - port: 5000
      targetPort: 5000
---
apiVersion: v1
kind: Endpoints
metadata:
  name: cp-gateway
  namespace: default
subsets:
  - addresses:
      - ip: 192.168.1.100
    ports:
      - port: 5000
---
# IngressRoute for full TLS backend control
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: cp-gateway-ingress
  namespace: default
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`ibkr.erix-homelab.site`)
      kind: Rule
      services:
        - name: cp-gateway
          port: 5000
          scheme: https
          serversTransport: cpgw-skip-tls
  tls:
    secretName: erix-homelab-site-tls
