apiVersion: apps/v1
kind: Deployment
metadata:
  name: trading-dashboard
  namespace: default
  labels:
    app: trading-dashboard
spec:
  replicas: 1
  selector:
    matchLabels:
      app: trading-dashboard
  template:
    metadata:
      labels:
        app: trading-dashboard
    spec:
      imagePullSecrets:
        - name: ghcr-credentials
      containers:
        - name: dashboard
          image: ghcr.io/erix/trading-dashboard:latest
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: trading-dashboard-config
          volumeMounts:
            - name: positions-db
              mountPath: /data/db
            - name: positions-meta
              mountPath: /trading/positions_meta.json
              subPath: positions_meta.json
              readOnly: true
            - name: playbook
              mountPath: /data/playbook.md
              subPath: playbook.md
              readOnly: true
            - name: iv-history
              mountPath: /data/iv_history.json
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          readinessProbe:
            httpGet:
              path: /api/status
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/status
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 30
      volumes:
        - name: positions-meta
          configMap:
            name: trading-positions-meta
        - name: playbook
          configMap:
            name: trading-playbook
        - name: positions-db
          hostPath:
            path: /home/erix/agents/trader/trading/db
            type: DirectoryOrCreate
        - name: iv-history
          hostPath:
            path: /home/erix/agents/trader/trading/iv_history.json
            type: FileOrCreate
