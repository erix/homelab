apiVersion: v1
kind: ServiceAccount
metadata:
  name: alerts-watcher
---
# Read-only across the cluster: CronJobs, their Jobs, and the logs of failed runs.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: alerts-watcher
rules:
  - apiGroups: ["batch"]
    resources: ["cronjobs", "jobs"]
    verbs: ["list"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["list"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: alerts-watcher
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: alerts-watcher
subjects:
  - kind: ServiceAccount
    name: alerts-watcher
    namespace: alerts
---
# Its own state, which records the open problems.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: alerts-watcher
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["create"]
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: ["alerts-state"]
    verbs: ["get", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: alerts-watcher
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: alerts-watcher
subjects:
  - kind: ServiceAccount
    name: alerts-watcher
